spring:
  application:
    name: ybc
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

app:
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
      authorization-base-url: ${KAKAO_AUTHORIZATION_BASE_URL}
      token-url: ${KAKAO_TOKEN_URL}
      user-info-url: ${KAKAO_USER_INFO_URL}
      scope: ${KAKAO_SCOPE:profile_nickname,account_email}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      issuer: ${JWT_ISSUER:ybc}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
