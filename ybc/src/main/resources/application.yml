spring:
  application:
    name: ybc
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true
    show-sql: true
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
      frontend-redirect-uri: ${KAKAO_FRONTEND_REDIRECT_URI}
      allowed-frontend-redirect-uris: ${KAKAO_ALLOWED_FRONTEND_REDIRECT_URIS:https://ybc-fe.vercel.app/auth/kakao/callback,https://ybcbadminton.co.kr/auth/kakao/callback,http://localhost:3000/auth/kakao/callback,http://127.0.0.1:3000/auth/kakao/callback,http://localhost:5173/auth/kakao/callback,http://127.0.0.1:5173/auth/kakao/callback}
      authorization-base-url: ${KAKAO_AUTHORIZATION_BASE_URL}
      token-url: ${KAKAO_TOKEN_URL}
      user-info-url: ${KAKAO_USER_INFO_URL}
      scope: ${KAKAO_SCOPE:profile_nickname,account_email}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      issuer: ${JWT_ISSUER:ybc}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    stub-enabled: ${MAIL_STUB_ENABLED:false}
    stub-delay-ms: ${MAIL_STUB_DELAY_MS:0}
    application:
      async-enabled: ${APPLICATION_MAIL_ASYNC_ENABLED:true}
  storage:
    gcs:
      bucket: ${GCP_STORAGE_BUCKET_NAME:}
      project-id: ${GCP_PROJECT_ID:}
      credentials-json: ${GCP_STORAGE_CREDENTIAL_JSON:}
      folder: ${GCS_FOLDER:images}
      max-image-count: ${GCS_MAX_IMAGE_COUNT:10}
  monitoring:
    discord:
      enabled: ${DISCORD_ALERT_ENABLED:false}
      webhook-url: ${DISCORD_ALERT_WEBHOOK_URL:}
      username: ${DISCORD_ALERT_USERNAME:YBC Monitor}
      mention: ${DISCORD_ALERT_MENTION:}
    supabase:
      enabled: ${DB_MONITORING_ENABLED:false}
      poll-interval-ms: ${DB_MONITORING_POLL_INTERVAL_MS:1800000}
      initial-delay-ms: ${DB_MONITORING_INITIAL_DELAY_MS:60000}
      db-size-limit-mb: ${DB_SIZE_LIMIT_MB:500}
      warning-threshold-percent: ${DB_WARNING_THRESHOLD_PERCENT:70}
      critical-threshold-percent: ${DB_CRITICAL_THRESHOLD_PERCENT:85}
      emergency-threshold-percent: ${DB_EMERGENCY_THRESHOLD_PERCENT:95}
    test-endpoint:
      enabled: ${MONITORING_TEST_ENDPOINT_ENABLED:false}
      token: ${MONITORING_TEST_ENDPOINT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s

server:
  forward-headers-strategy: framework
