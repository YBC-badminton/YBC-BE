spring:
  application:
    name: ybc
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  auth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
      authorization-base-url: ${KAKAO_AUTHORIZATION_BASE_URL}
      token-url: ${KAKAO_TOKEN_URL}
      user-info-url: ${KAKAO_USER_INFO_URL}
      scope: ${KAKAO_SCOPE:profile_nickname,account_email}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      issuer: ${JWT_ISSUER:ybc}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    stub-enabled: ${MAIL_STUB_ENABLED:false}
    stub-delay-ms: ${MAIL_STUB_DELAY_MS:0}
    application:
      async-enabled: ${APPLICATION_MAIL_ASYNC_ENABLED:true}
