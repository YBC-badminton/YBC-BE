spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ybc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  auth:
    kakao:
      client-id: test-client-id
      client-secret:
      redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
      frontend-redirect-uri: https://ybc-fe.vercel.app/auth/kakao/callback
      authorization-base-url: https://kauth.kakao.com/oauth/authorize
      token-url: https://kauth.kakao.com/oauth/token
      user-info-url: https://kapi.kakao.com/v2/user/me
      scope: profile_nickname,account_email
    jwt:
      secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: ybc-test
      access-token-expiration-seconds: 3600
      refresh-token-expiration-seconds: 1209600
  vote:
    additional-reservation:
      scheduler-enabled: false
